<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#0b1017; }
  a { color:#8b9bff; }
  a:hover { color:#b4c0ff; }
</style>
</helmet>
<div style="box-sizing:border-box;min-height:100vh;background:radial-gradient(120% 120% at 30% 20%,#141c29 0%,#0b1017 60%);display:flex;align-items:center;justify-content:center;padding:80px 40px;font-family:'Plus Jakarta Sans',Helvetica,sans-serif">
  <div style="display:flex;align-items:center;gap:30px">
    <div style="position:relative;width:132px;height:132px;flex:none">
      <div style="position:absolute;inset:0;border-radius:38px;background:linear-gradient(140deg,#8b5cf6 0%,#6366f1 52%,#2f7ff0 100%);box-shadow:0 26px 60px -22px rgba(99,102,241,.9)"></div>
      <div style="position:absolute;left:33px;bottom:-16px;width:33px;height:28px;background:#2f7ff0;clip-path:polygon(0 0,100% 0,18% 100%);border-bottom-left-radius:5px"></div>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:11px;padding:0 30px">
        <div style="display:flex;gap:10px;align-items:center">
          <div style="height:14px;flex:1;border-radius:99px;background:#fff"></div>
          <div style="width:14px;height:14px;border-radius:99px;background:rgba(255,255,255,.6)"></div>
        </div>
        <div style="height:14px;width:100%;border-radius:99px;background:#fff"></div>
        <div style="height:14px;width:58%;border-radius:99px;background:rgba(255,255,255,.7)"></div>
      </div>
    </div>
    <div style="font-size:60px;font-weight:800;letter-spacing:-.035em;color:#eef3fa;line-height:1">Inbox<span style="color:#8b9bff">Crm</span></div>
  </div>
</div>

</x-dc>
</body>
</html>
