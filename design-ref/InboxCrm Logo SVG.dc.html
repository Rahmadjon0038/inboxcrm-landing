<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin:0; background:#0b1017; }
  a { color:#8b9bff; }
  a:hover { color:#b4c0ff; }
</style>
</helmet>
<div style="box-sizing:border-box;min-height:100vh;background:#0b1017;padding:48px;font-family:'IBM Plex Mono',ui-monospace,monospace;display:flex;flex-direction:column;gap:24px">
  <div style="font-size:12px;letter-spacing:.14em;color:#8ea0b8;text-transform:uppercase">SVG eksport — logo/</div>
  <div style="display:flex;flex-wrap:wrap;gap:24px">
    <div style="flex:1 1 300px;background:#111823;border:1px solid #1e2836;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:18px;align-items:flex-start">
      <img src="logo/inboxcrm-mark.svg" alt="mark" style="height:110px">
      <div style="font-size:12px;color:#93a4bb">inboxcrm-mark.svg</div>
    </div>
    <div style="flex:1 1 420px;background:#111823;border:1px solid #1e2836;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:18px;align-items:flex-start">
      <img src="logo/inboxcrm-lockup-dark-bg.svg" alt="lockup dark" style="width:100%;max-width:400px">
      <div style="font-size:12px;color:#93a4bb">inboxcrm-lockup-dark-bg.svg</div>
    </div>
    <div style="flex:1 1 420px;background:#f5f7fb;border:1px solid #1e2836;border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:18px;align-items:flex-start">
      <img src="logo/inboxcrm-lockup-light-bg.svg" alt="lockup light" style="width:100%;max-width:400px">
      <div style="font-size:12px;color:#4a5768">inboxcrm-lockup-light-bg.svg</div>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
